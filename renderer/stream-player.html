<!doctype html><html><head><meta charset="utf-8"><style>html,body,video{width:100%;height:100%;margin:0;background:#05060a}html,body{overflow:hidden}video{display:block;object-fit:contain}video[data-luma-sub-render]::cue{color:transparent;background:transparent;text-shadow:none}</style><script src="vendor/hls.min.js"></script></head><body><video id="v" playsinline></video><script>

        const index = named >= 0 ? named : initialAudio;

        }

      const levels = h ? [...new Set(h.levels.map((x) => x.height).filter(Boolean))].sort((a, b) => a - b) : [];

        ...(audio.length > 1 ? { snd: { v: audio[h.audioTrack]?.name || audio[h.audioTrack]?.lang || 'Дорожка 1', ls: audio.map((x, i) => x.name || x.lang || `Дорожка ${i + 1}`) } } : {}),
        ...(subs.length ? { cc: { v: h.subtitleTrack >= 0 ? (subs[h.subtitleTrack]?.name || subs[h.subtitleTrack]?.lang || 'Субтитры') : 'Откл', ls: ['Откл', ...subs.map((x, i) => x.name || x.lang || `Субтитры ${i + 1}`)] } } : {}) };
    };
