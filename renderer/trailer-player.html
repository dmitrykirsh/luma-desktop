<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#05060a;overflow:hidden;font:600 13px Arial,sans-serif;color:white}video{width:100%;height:100%;object-fit:contain}button{border:0;cursor:pointer;color:white;background:#292b31;border-radius:20px;height:36px;padding:0 15px;font-weight:700}button:hover{background:#ff3366}.controls{position:absolute;left:0;right:0;bottom:0;padding:25px 18px 14px;background:linear-gradient(transparent,rgba(0,0,0,.9));display:flex;gap:12px;align-items:center}.seek{flex:1;accent-color:#ff3366}.vol{width:76px;accent-color:#ff3366}.error{position:absolute;inset:0;display:grid;place-content:center;background:#0b0c10;color:#aaa}.error[hidden]{display:none}</style><script src="vendor/hls.min.js"></script></head><body><video playsinline></video><div class="error" hidden>Не удалось воспроизвести трейлер</div><div class="controls"><button id="toggle" aria-label="Пауза">Ⅱ</button><input class="seek" aria-label="Позиция" type="range" min="0" max="1000" value="0"><span id="time">0:00 / 0:00</span><button id="mute" aria-label="Звук">♫</button><input class="vol" aria-label="Громкость" type="range" min="0" max="100" value="100"><button id="full" aria-label="На весь экран">⛶</button></div><script src="trailer-player.js"></script></body></html>
